# Install with:
#   dsh plugin --profile web add github:StarPivotNet/dsh-plugins-public#path:packages/plugin-marketplace
# then restart dsh web. Removing the bundle restores the shipped Plugins page.

- insert:
    - id: plugin-marketplace
      name: '@starpivot/dsh-plugin-marketplace/host'
      config:
        catalogUrls:
          - https://raw.githubusercontent.com/StarPivotNet/dsh-plugin-catalog/main/catalog.json

    - id: ui-settings-plugin-marketplace
      name: '@starpivot/dsh-plugin-marketplace'

- id: ui-settings-plugin-inventory
  disabled: true

- id: hmr
  disabled: true
